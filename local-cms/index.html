<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Admin</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        margin: 0;
        padding: 40px 24px;
        color: #0f172a;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 20px 18px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      p {
        margin: 8px 0;
        color: #475569;
        line-height: 1.7;
      }
      code {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 2px 8px;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>管理后台已迁移</h1>
      <p>此服务保留为数据/API 服务（写文章、上传图片、更新 dataJs 等）。</p>
      <p>请先启动站点前端（<code>npm run dev</code>），再访问 <code>/cms</code> 路由进入后台页面。</p>
      <p>如果你在本机默认端口启动 Vite，后台地址一般为：<a href="http://localhost:5173/cms">http://localhost:5173/cms</a></p>
    </div>
  </body>
</html>
